name = "toolkits-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "toolkits-assets"

[vars]
GITHUB_OWNER = "YOUR_GITHUB_USERNAME"
GITHUB_REPO = "toolkits-mcp"
ASSETS_PUBLIC_BASE_URL = "https://REPLACE_WITH_YOUR_R2_PUBLIC_URL"

# Secrets (MCP_AUTH_TOKEN, GITHUB_PAT) are NOT set here.
# Add them via: Cloudflare Dashboard → Worker → Settings → Variables and Secrets
# or via CLI: wrangler secret put MCP_AUTH_TOKEN

[[routes]]
pattern = "mcp.toolkits.app/*"
custom_domain = true
