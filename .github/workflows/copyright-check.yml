name: Copyright Check (AudD)
on:
  repository_dispatch:
    types: [copyright_check_run]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install -U requests

      - name: Pull audio from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          R2_KEY="${{ github.event.client_payload.r2_key }}"
          aws s3 cp "s3://toolkits-assets/${R2_KEY}" input_raw --endpoint-url "$R2_ENDPOINT"

      - name: Identify via AudD and report to Telegram
        env:
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          python3 << 'PYEOF'
          import os, requests

          api_token = os.environ["AUDD_API_TOKEN"]
          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          def send_message(text):
              requests.post(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  data={"chat_id": chat_id, "text": text},
              )

          with open("input_raw", "rb") as f:
              files = {"file": ("audio.mp3", f, "audio/mpeg")}
              data = {"api_token": api_token, "return": "spotify,apple_music,deezer"}
              resp = requests.post("https://api.audd.io/", data=data, files=files)

          result = resp.json()
          print(result)

          if result.get("status") != "success":
              err = result.get("error", {}).get("error_message", "unknown error")
              send_message(f"চেক করতে সমস্যা হয়েছে: {err}")
          elif not result.get("result"):
              send_message(
                  "✅ কোনো ম্যাচ পাওয়া যায়নি — এই exact অডিওটা AudD-এর ডাটাবেজে থাকা কোনো distributed track-এর সাথে মেলেনি।\n\n"
                  "⚠️ মনে রাখবে: বাংলা/আঞ্চলিক গানের ক্ষেত্রে coverage কম হতে পারে, তাই এটা 100% guarantee না যে গানটা সম্পূর্ণ unreleased।"
              )
          else:
              r = result["result"]
              msg = "⚠️ ম্যাচ পাওয়া গেছে — এই গানটা ইতিমধ্যে distributed:\n\n"
              msg += f"🎵 Title: {r.get('title', 'N/A')}\n"
              msg += f"🎤 Artist: {r.get('artist', 'N/A')}\n"
              if r.get("album"):
                  msg += f"💿 Album: {r['album']}\n"
              if r.get("release_date"):
                  msg += f"📅 Release: {r['release_date']}\n"
              if r.get("label"):
                  msg += f"🏷️ Label: {r['label']}\n"

              platforms = []
              if r.get("spotify", {}).get("external_urls", {}).get("spotify"):
                  platforms.append(f"🎧 Spotify: {r['spotify']['external_urls']['spotify']}")
              if r.get("apple_music", {}).get("url"):
                  platforms.append(f"🍎 Apple Music: {r['apple_music']['url']}")
              if r.get("deezer", {}).get("link"):
                  platforms.append(f"🎵 Deezer: {r['deezer']['link']}")

              if platforms:
                  msg += "\n📍 যে যে platform-এ পাওয়া গেছে:\n" + "\n".join(platforms)
              else:
                  msg += "\n📍 কোনো specific platform link পাওয়া যায়নি, তবে ম্যাচ আছে।"

              send_message(msg)
          PYEOF

      - name: Notify on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="দুঃখিত, কপিরাইট চেক করা যায়নি। আবার চেষ্টা করো।"
