name: X Video Download
on:
  repository_dispatch:
    types: [x_download]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          pip install -U --pre "yt-dlp[default]"
          sudo apt-get install -y ffmpeg

      - name: Download with live progress updates in Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          VIDEO_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 << 'PYEOF'
          import os, requests, yt_dlp

          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          video_url = os.environ["VIDEO_URL"]

          # Send an initial progress message and remember its message_id
          resp = requests.post(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data={"chat_id": chat_id, "text": "ডাউনলোড হচ্ছে... 0%"},
          ).json()
          message_id = resp["result"]["message_id"]

          last_reported = {"pct": -10}

          def edit_progress(text):
              requests.post(
                  f"https://api.telegram.org/bot{bot_token}/editMessageText",
                  data={"chat_id": chat_id, "message_id": message_id, "text": text},
              )

          def progress_hook(d):
              if d["status"] == "downloading":
                  total = d.get("total_bytes") or d.get("total_bytes_estimate")
                  downloaded = d.get("downloaded_bytes", 0)
                  if total:
                      pct = int(downloaded / total * 100)
                      # Only update every ~10% to avoid Telegram rate limits
                      if pct - last_reported["pct"] >= 10:
                          last_reported["pct"] = pct
                          edit_progress(f"ডাউনলোড হচ্ছে... {pct}%")
              elif d["status"] == "finished":
                  edit_progress("ডাউনলোড সম্পন্ন, পাঠানো হচ্ছে...")

          ydl_opts = {
              "outtmpl": "video.%(ext)s",
              "progress_hooks": [progress_hook],
          }

          with yt_dlp.YoutubeDL(ydl_opts) as ydl:
              ydl.download([video_url])
          PYEOF

      - name: Normalize output filename
        run: mv video.* input.mp4

      - name: Send video to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -s -F "chat_id=${CHAT_ID}" -F "video=@input.mp4" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo"

      - name: Cache video in R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          JOB_ID="${{ github.event.client_payload.job_id }}"
          aws s3 cp input.mp4 "s3://toolkits-assets/x-cache/${JOB_ID}.mp4" --endpoint-url "$R2_ENDPOINT"

      - name: Ask for audio conversion
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"অডিও ভার্সন (MP3/WAV) লাগবে?\", \"reply_markup\": {\"inline_keyboard\": [[{\"text\": \"🎵 হ্যাঁ, Audio বানাও\", \"callback_data\": \"x_audio:${JOB_ID}\"}]]}}"

      - name: Notify on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="দুঃখিত, এই ভিডিওটি ডাউনলোড করা যায়নি। লিংক ভুল হতে পারে বা ভিডিওটি প্রাইভেট। আবার চেষ্টা করো।"
