name: Debug ACRCloud Secret
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret shape (no value exposed)
        env:
          KEY: ${{ secrets.ACRCLOUD_ACCESS_KEY }}
          SECRET: ${{ secrets.ACRCLOUD_ACCESS_SECRET }}
          HOST: ${{ secrets.ACRCLOUD_HOST }}
        run: |
          echo "Access Key length: ${#KEY} (expected: 32)"
          echo "Secret Key length: ${#SECRET} (expected: 40)"
          echo "Host length: ${#HOST}"
          echo "Host value ends with: ...${HOST: -10}"

          TRIMMED_KEY=$(echo -n "$KEY" | xargs)
          TRIMMED_SECRET=$(echo -n "$SECRET" | xargs)
          if [ "$KEY" != "$TRIMMED_KEY" ]; then
            echo "⚠️ Access Key has leading/trailing whitespace!"
          else
            echo "✅ Access Key has no extra whitespace"
          fi
          if [ "$SECRET" != "$TRIMMED_SECRET" ]; then
            echo "⚠️ Secret Key has leading/trailing whitespace!"
          else
            echo "✅ Secret Key has no extra whitespace"
          fi
