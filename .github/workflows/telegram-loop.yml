name: Telegram Seamless Loop

on:
  repository_dispatch:
    types: [process_loop]

jobs:
  build-and-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg + awscli
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg awscli

      - name: Configure R2 (S3-compatible) env
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "R2_ENDPOINT=https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com" >> $GITHUB_ENV

      - name: Download a source file (helper, used for both video and audio slots)
        run: |
          mkdir -p work
          echo "download_source () {
            local input_key=\"\$1\" drive_id=\"\$2\" outfile=\"\$3\"
            if [ -n \"\$input_key\" ]; then
              aws s3 cp \"s3://toolkits-assets/\$input_key\" \"\$outfile\" --endpoint-url \"$R2_ENDPOINT\"
            elif [ -n \"\$drive_id\" ]; then
              curl -sc /tmp/cookies \"https://drive.google.com/uc?export=download&id=\$drive_id\" > /tmp/page.html
              CONFIRM=\$(grep -o 'confirm=[0-9A-Za-z_]*' /tmp/page.html | head -1 | cut -d= -f2)
              if [ -n \"\$CONFIRM\" ]; then
                curl -Lb /tmp/cookies \"https://drive.google.com/uc?export=download&confirm=\$CONFIRM&id=\$drive_id\" -o \"\$outfile\"
              else
                curl -Lb /tmp/cookies \"https://drive.google.com/uc?export=download&id=\$drive_id\" -o \"\$outfile\"
              fi
            fi
          }" > work/download_source.sh

      - name: Build and stream output
        env:
          IS_VIDEO: ${{ github.event.client_payload.is_video }}
          INPUT_KEY: ${{ github.event.client_payload.input_key }}
          DRIVE_ID: ${{ github.event.client_payload.drive_id }}
          AUDIO_INPUT_KEY: ${{ github.event.client_payload.audio_input_key }}
          AUDIO_DRIVE_ID: ${{ github.event.client_payload.audio_drive_id }}
          TARGET_MINUTES: ${{ github.event.client_payload.target_minutes }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          set -e
          source work/download_source.sh
          DURATION_SEC=$((TARGET_MINUTES * 60))
          TIMESTAMP=$(date +%s)

          build_audio_full () {
            local src="$1" out="$2"
            local C=3
            local D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$src")
            local long_enough=$(python3 -c "print(1 if $D >= $DURATION_SEC else 0)")
            if [ "$long_enough" = "1" ]; then
              ffmpeg -y -i "$src" -t $DURATION_SEC -acodec libmp3lame -b:a 192k "$out"
            else
              local BODY=$(python3 -c "print($D - 2*$C)")
              ffmpeg -y -sseof -$C -i "$src" -t $C work/a_tail.mp3
              ffmpeg -y -ss 0 -t $C -i "$src" work/a_head.mp3
              ffmpeg -y -i work/a_tail.mp3 -i work/a_head.mp3 -filter_complex "acrossfade=d=$C:c1=tri:c2=tri" work/a_blended.mp3
              ffmpeg -y -ss $C -t $BODY -i "$src" work/a_body.mp3
              ffmpeg -y -i work/a_blended.mp3 -i work/a_body.mp3 -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[out]" -map "[out]" -acodec libmp3lame -q:a 2 work/a_loop_unit.mp3
              ffmpeg -y -stream_loop -1 -i work/a_loop_unit.mp3 -t $DURATION_SEC -acodec libmp3lame -b:a 192k "$out"
            fi
          }

          if [ "$IS_VIDEO" = "true" ]; then
            download_source "$INPUT_KEY" "" work/source_video

            C=1.5
            D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 work/source_video)
            BODY=$(python3 -c "print($D - 2*$C)")
            ffmpeg -y -sseof -$C -i work/source_video -t $C -an -c:v libx264 -crf 14 -preset slow work/tail.mp4
            ffmpeg -y -ss 0 -t $C -i work/source_video -an -c:v libx264 -crf 14 -preset slow work/head.mp4
            ffmpeg -y -i work/tail.mp4 -i work/head.mp4 -filter_complex \
              "[0:v][1:v]xfade=transition=fade:duration=$C:offset=0[v]" -map "[v]" \
              -c:v libx264 -crf 14 -preset slow work/blended.mp4
            ffmpeg -y -ss $C -t $BODY -i work/source_video -an -c:v libx264 -crf 14 -preset slow work/body.mp4
            ffmpeg -y -i work/blended.mp4 -i work/body.mp4 -filter_complex \
              "[0:v][1:v]concat=n=2:v=1:a=0[v]" -map "[v]" \
              -c:v libx264 -crf 14 -preset slow -g 30 work/loop_unit.mp4

            OUTPUT_KEY="telegram-outputs/${CHAT_ID}-${TIMESTAMP}.mp4"

            if [ -n "$AUDIO_INPUT_KEY" ] || [ -n "$AUDIO_DRIVE_ID" ]; then
              download_source "$AUDIO_INPUT_KEY" "$AUDIO_DRIVE_ID" work/source_audio
              build_audio_full work/source_audio work/audio_full.mp3

              ffmpeg -y -stream_loop -1 -i work/loop_unit.mp4 -i work/audio_full.mp3 -t $DURATION_SEC \
                -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k \
                -movflags +frag_keyframe+empty_moov+default_base_moof -f mp4 pipe:1 | \
              aws s3 cp - "s3://toolkits-assets/${OUTPUT_KEY}" --endpoint-url "$R2_ENDPOINT"
            else
              ffmpeg -y -stream_loop -1 -i work/loop_unit.mp4 -t $DURATION_SEC \
                -c copy -movflags +frag_keyframe+empty_moov+default_base_moof \
                -f mp4 pipe:1 | \
              aws s3 cp - "s3://toolkits-assets/${OUTPUT_KEY}" --endpoint-url "$R2_ENDPOINT"
            fi

          else
            download_source "$INPUT_KEY" "$DRIVE_ID" work/source_audio
            OUTPUT_KEY="telegram-outputs/${CHAT_ID}-${TIMESTAMP}.mp3"
            build_audio_full work/source_audio work/audio_full.mp3
            cat work/audio_full.mp3 | aws s3 cp - "s3://toolkits-assets/${OUTPUT_KEY}" --endpoint-url "$R2_ENDPOINT"
          fi

          echo "OUTPUT_KEY=$OUTPUT_KEY" >> $GITHUB_ENV

      - name: Notify user on Telegram with the download link
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          BASE_URL="${{ vars.R2_PUBLIC_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://pub-754afb105d4d4297ae849b868850f2da.r2.dev"
          fi
          DOWNLOAD_URL="${BASE_URL}/${OUTPUT_KEY}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="Done! Your seamless loop is ready: ${DOWNLOAD_URL}"

      - name: Clean up R2 source inputs
        run: |
          [ -n "${{ github.event.client_payload.input_key }}" ] && aws s3 rm "s3://toolkits-assets/${{ github.event.client_payload.input_key }}" --endpoint-url "$R2_ENDPOINT" || true
          [ -n "${{ github.event.client_payload.audio_input_key }}" ] && aws s3 rm "s3://toolkits-assets/${{ github.event.client_payload.audio_input_key }}" --endpoint-url "$R2_ENDPOINT" || true
