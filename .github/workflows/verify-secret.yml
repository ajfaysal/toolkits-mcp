name: Verify ACRCloud Secret Match
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare against known-correct signature
        env:
          SEC: ${{ secrets.ACRCLOUD_ACCESS_SECRET }}
        run: |
          STS=$'POST\n/v1/identify\n2c4f752fbc9c24783d90f4c239d7d9ff\naudio\n1\n1787799631'
          SIG=$(printf %s "$STS" | openssl dgst -sha1 -hmac "$SEC" -binary | base64)
          echo "Computed signature length: ${#SIG}"
          if [ "$SIG" = "XEXk06uPTAXo3kTKGTsHA96biZY=" ]; then
            echo "RESULT: ✅ MATCH — secret in GitHub is CORRECT"
          else
            echo "RESULT: ❌ NO MATCH — secret in GitHub is still WRONG"
          fi
