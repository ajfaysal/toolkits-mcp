name: Generic Audio Extract
on:
  repository_dispatch:
    types: [generic_audio]

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg && break
            echo "Retry $i failed, waiting 10s..."
            sleep 10
          done

      - name: Pull cached video from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          JOB_ID="${{ github.event.client_payload.job_id }}"
          aws s3 cp "s3://toolkits-assets/generic-cache/${JOB_ID}.mp4" input.mp4 --endpoint-url "$R2_ENDPOINT"

      - name: Extract MP3 + WAV
        run: |
          ffmpeg -i input.mp4 -vn -acodec libmp3lame -q:a 2 output.mp3
          ffmpeg -i input.mp4 -vn -acodec pcm_s16le -ar 44100 output.wav

      - name: Send audio to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -s -F "chat_id=${CHAT_ID}" -F "audio=@output.mp3" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendAudio"
          curl -s -F "chat_id=${CHAT_ID}" -F "document=@output.wav" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

      - name: Cache audio in R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          JOB_ID="${{ github.event.client_payload.job_id }}"
          aws s3 cp output.mp3 "s3://toolkits-assets/audio-cache/${JOB_ID}.mp3" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp output.wav "s3://toolkits-assets/audio-cache/${JOB_ID}.wav" --endpoint-url "$R2_ENDPOINT"

      - name: Ask about metadata edit, copyright check, mastering
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"এই অডিওর সাথে কী করতে চাও?\", \"reply_markup\": {\"inline_keyboard\": [[{\"text\": \"✏️ এডিট করো\", \"callback_data\": \"dlmeta_edit:${JOB_ID}\"}, {\"text\": \"✅ থাক, স্কিপ\", \"callback_data\": \"dlmeta_skip:${JOB_ID}\"}],[{\"text\": \"🔍 কপিরাইট চেক করো\", \"callback_data\": \"copyright_check:${JOB_ID}\"}],[{\"text\": \"🎚️ Audio Mastering করো\", \"callback_data\": \"audio_master:${JOB_ID}\"}]]}}"

      - name: Cleanup R2 video cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          JOB_ID="${{ github.event.client_payload.job_id }}"
          aws s3 rm "s3://toolkits-assets/generic-cache/${JOB_ID}.mp4" --endpoint-url "$R2_ENDPOINT" || true

      - name: Notify on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="দুঃখিত, অডিও বানাতে সমস্যা হয়েছে।"
